apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ace-rhg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/omkarP-bit/AI-Compliance-Engine-RHG.git
    targetRevision: main
    path: infra/helm/ace-rhg
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ace-rhg
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
