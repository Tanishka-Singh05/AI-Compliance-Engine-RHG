# Grafana dashboard provider — loads every dashboard JSON in the mounted
# dashboards directory on startup and every updateIntervalSeconds.
apiVersion: 1

providers:
  - name: ACE+RHG
    orgId: 1
    folder: ACE+RHG
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
