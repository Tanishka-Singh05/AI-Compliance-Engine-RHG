# Grafana datasource provisioning — wires Grafana to the Prometheus service.
#
# The ``uid`` is pinned so the provisioned dashboards can reference the
# datasource with a stable identifier instead of Grafana's generated one.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
