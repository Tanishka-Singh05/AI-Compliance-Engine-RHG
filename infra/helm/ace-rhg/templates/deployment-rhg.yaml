apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ace-rhg.fullname" . }}-rhg
  labels:
    {{- include "ace-rhg.labels" . | nindent 4 }}
    app.kubernetes.io/component: rhg
spec:
  replicas: {{ .Values.rhg.replicaCount }}
  selector:
    matchLabels:
      {{- include "ace-rhg.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rhg
  template:
    metadata:
      labels:
        {{- include "ace-rhg.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rhg
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rhg
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "rhg.main:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - name: http
              containerPort: 8001
            - name: metrics
              containerPort: {{ .Values.rhg.metricsPort }}
          env:
            - name: ACE_URL
              value: {{ include "ace-rhg.aceUrl" . | quote }}
            - name: REDIS_URL
              value: {{ include "ace-rhg.redisUrl" . | quote }}
            - name: RHG_METRICS_PORT
              value: {{ .Values.rhg.metricsPort | quote }}
            - name: RHG_METRICS_ENABLED
              value: "true"
            {{- range $k, $v := .Values.rhg.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "ace-rhg.secretName" . }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.rhg.resources | nindent 12 }}
