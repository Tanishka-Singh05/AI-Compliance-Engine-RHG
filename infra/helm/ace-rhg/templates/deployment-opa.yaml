apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ace-rhg.fullname" . }}-opa
  labels:
    {{- include "ace-rhg.labels" . | nindent 4 }}
    app.kubernetes.io/component: opa
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ace-rhg.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: opa
  template:
    metadata:
      labels:
        {{- include "ace-rhg.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: opa
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: opa
          image: "{{ .Values.opa.image.repository }}:{{ .Values.opa.image.tag }}"
          args: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
          ports:
            - name: http
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
          resources:
            {{- toYaml .Values.opa.resources | nindent 12 }}
      volumes:
        - name: policies
          configMap:
            name: {{ include "ace-rhg.policiesName" . }}
