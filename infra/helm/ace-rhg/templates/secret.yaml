{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ace-rhg.fullname" . }}-secrets
  labels:
    {{- include "ace-rhg.labels" . | nindent 4 }}
type: Opaque
stringData:
  NEBIUS_API_KEY: {{ .Values.secrets.nebiusApiKey | quote }}
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | quote }}
  SLACK_WEBHOOK_URL: {{ .Values.secrets.slackWebhookUrl | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
{{- end }}
